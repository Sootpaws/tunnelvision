[package]
name = "tunnelvision"
description = "TunnelVision is an interactive catalog of the mural under RIT's Residence Halls."
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.52", features = [ "derive" ] }
fastrand = "2.3.0"
form_urlencoded = "1.2.2"
serde = { version = "1.0", features = [ "derive" ] }
tokio = { version = "1.47.1", features = [ "rt-multi-thread" ] }
upon = "0.10.0"

[dependencies.axum]
version = "0.8.4"
default-features = false
features = [ "http1", "query", "tokio" ]

[dependencies.image]
version = "0.25.8"
default-features = false
features = [ "jpeg", "png" ]

[dependencies.toml]
version = "0.9.5"
default-features = false
features = [ "serde", "parse" ]
